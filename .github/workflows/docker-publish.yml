name: Docker Build and Publish

on:
  push:
    branches: ["master", "new-dev"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional candidate image tag
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update version in app.php
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          echo "Updated version to: $VERSION"

      - name: Build linux/amd64 runtime check image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: xboard-runtime-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify linux/amd64 runtime image
        run: |
          set -euo pipefail
          docker run --rm -i --network none --entrypoint sh \
            "xboard-runtime-check:${GITHUB_SHA}" -s <<'CONTAINER_RUNTIME_CHECK'
          set -eu
          composer check-platform-reqs --no-dev
          php -r 'if (PHP_VERSION_ID < 80235 || PHP_VERSION_ID >= 80300) { fwrite(STDERR, "Unexpected PHP ".PHP_VERSION."\n"); exit(1); } $versions = ["swoole" => "6.3.0RC1", "igbinary" => "3.2.16", "redis" => "6.3.0"]; foreach ($versions as $extension => $version) { if (phpversion($extension) !== $version) { fwrite(STDERR, "Unexpected $extension ".phpversion($extension)."\n"); exit(1); } }'
          redis-server --version | grep -Eq '(^| )v=8\.4\.2( |$)'
          caddy version | grep -Eq '^v2\.11\.4( |$)'
          CONTAINER_RUNTIME_CHECK

      - name: Test entrypoint runtime update
        run: |
          set -euo pipefail
          docker run --rm -i --network none \
            -e XBOARD_ENTRYPOINT_TEST_DISPOSABLE=1 \
            --entrypoint sh "xboard-runtime-check:${GITHUB_SHA}" -s <<'CONTAINER_ENTRYPOINT_TEST'
          set -eu
          cp /www/tests/shell/entrypoint-runtime-update.sh /tmp/entrypoint-runtime-update.sh
          exec sh /tmp/entrypoint-runtime-update.sh
          CONTAINER_ENTRYPOINT_TEST

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          load: false
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host
